<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Discovery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#edf1f3;--surface:#fff;--ink:#16232b;--muted:#5d6f78;--line:#cbd5da;--pine:#1f6f5b;--pine-d:#17523f;--amber:#b87a10;--red:#b3392f;
--head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10191e;--surface:#17232a;--ink:#e6eef1;--muted:#93a6af;--line:#2b3d46;--pine:#4fb596;--pine-d:#7fd1b5;--amber:#e0a63a;--red:#e87b70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--ink);color:#fff;flex-wrap:wrap}
header h1{font-size:20px;flex:1;min-width:200px}
nav button{background:none;border:0;color:#b9c9d0;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500}
nav button[aria-current=true]{background:#fff;color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
.btn{background:var(--pine);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--pine-d)}.btn.ghost{background:none;color:var(--pine);border:1px solid var(--line)}.btn.danger{background:none;color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:3px 9px;font-size:13px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:28px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 16px 16px;align-self:start}
.searchbar{display:flex;gap:8px;margin-bottom:6px}
.mode{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-bottom:16px}.mode label{display:inline-flex;gap:6px;margin:0;align-items:center;color:inherit}.mode input{width:auto}
.row{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:6px;padding:14px 18px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.row:hover{border-color:var(--pine)}
.row h3{font-size:18px}.row p{margin:4px 0 8px;color:var(--muted);grid-column:1}
.meta{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:12.5px}
.chip.beginner{border-color:var(--pine);color:var(--pine)}.chip.advanced{border-color:var(--red);color:var(--red)}.chip.intermediate{border-color:var(--amber);color:var(--amber)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:24px;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,20,25,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}.stat b{font:700 28px var(--head);display:block}.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--amber)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:500}
.bars div{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.bars i{display:block;height:10px;background:var(--pine);border-radius:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}@media(max-width:820px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.bar-actions{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;display:none}
.stale{color:var(--amber);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Project Discovery</h1>
  <nav><button id="t-discover" aria-current="true">Discover</button><button id="t-admin">Admin dashboard</button></nav>
</header>
<main>
<section id="discover" class="layout">
  <aside class="filters">
    <label for="f-cat">Category</label><select id="f-cat"><option value="">All categories</option></select>
    <label for="f-diff">Difficulty</label>
    <select id="f-diff"><option value="">Any</option><option>beginner</option><option>intermediate</option><option>advanced</option></select>
    <label for="f-skills">Skills (comma separated, all required)</label><input id="f-skills" placeholder="Python, Docker">
    <label for="f-sort">Sort by</label>
    <select id="f-sort"><option value="newest">Newest</option><option value="stars">Most stars</option><option value="issues">Most open issues</option><option value="title">Title</option></select>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="f-open" type="checkbox" style="width:auto"> Has open issues</label>
  </aside>
  <div>
    <form class="searchbar" id="search-form"><input id="q" placeholder="Search projects, or describe what you want to work on" aria-label="Search"><button class="btn">Search</button></form>
    <div class="mode"><label><input type="radio" name="mode" value="keyword" checked> Keyword</label><label><input type="radio" name="mode" value="semantic"> Semantic (Qdrant)</label></div>
    <div id="results"></div>
  </div>
</section>

<section id="admin" hidden>
  <div class="stats" id="stats"></div>
  <div class="two"><div><h3>Projects by category</h3><div class="bars" id="by-cat"></div></div><div><h3>Most required skills</h3><div class="bars" id="top-skills"></div></div></div>
  <div class="bar-actions"><h2>Manage projects</h2><span><button class="btn ghost" id="sync-btn">Refresh stale embeddings</button> <button class="btn" id="new-btn">New project</button></span></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Title</th><th>Category</th><th>Level</th><th>Open issues</th><th>Embedding</th><th></th></tr></thead><tbody id="admin-rows"></tbody></table></div>
</section>
</main>

<dialog id="detail"></dialog>
<dialog id="editor">
  <form id="edit-form" method="dialog">
    <h2 id="edit-title">New project</h2>
    <label for="e-title">Title</label><input id="e-title" required maxlength="200">
    <label for="e-desc">Description</label><textarea id="e-desc" rows="4"></textarea>
    <label for="e-repo">Repository URL</label><input id="e-repo" type="url">
    <div class="grid2"><div><label for="e-cat">Category</label><select id="e-cat"></select></div>
    <div><label for="e-diff">Difficulty</label><select id="e-diff"><option>beginner</option><option>intermediate</option><option>advanced</option></select></div>
    <div><label for="e-status">Status</label><select id="e-status"><option>active</option><option>paused</option><option>archived</option></select></div>
    <div><label for="e-stars">Stars</label><input id="e-stars" type="number" min="0" value="0"></div></div>
    <label for="e-skills">Required skills (comma separated)</label><input id="e-skills">
    <p style="text-align:right;margin-top:18px"><button class="btn ghost" type="button" id="e-cancel">Cancel</button> <button class="btn" id="e-save">Save project</button></p>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
